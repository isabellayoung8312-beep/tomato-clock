            theme: {

                    colors: {
                        tomato: {

                            100: '#FFCDD2',

                </div>

            <!-- CARD 2: Large Countdown Timer Card (番茄钟倒计时核心大卡片) -->

    <!-- SCRIPT ENGINE -->
    <script>
        // --- DATA & STATE ---
        const DEFAULT_PROJECTS = ['练字', '静坐', '创作', '阅读', '创作小说'];
        
        let state = {
            projects: JSON.parse(localStorage.getItem('pomodoro_projects')) || [...DEFAULT_PROJECTS],
            currentProject: localStorage.getItem('pomodoro_current_project') || '练字',
            records: JSON.parse(localStorage.getItem('pomodoro_records')) || [],
            settings: {
                focusMinutes: parseInt(localStorage.getItem('pomodoro_focus_min')) || 25,
                breakMinutes: parseInt(localStorage.getItem('pomodoro_break_min')) || 5
            }
        };

        // Ensure default selected project exists
        if (!state.projects.includes(state.currentProject)) {
            state.currentProject = state.projects[0] || '练字';
        }

        // --- TIMER ENGINE STATE ---
        let timerMode = 'IDLE'; // 'IDLE' | 'FOCUSING' | 'BREAKING'
        let targetEndTime = null;
        let timerDurationSeconds = state.settings.focusMinutes * 60;
        let remainingSeconds = timerDurationSeconds;
        let timerInterval = null;
        let wakeLock = null;
        let isFastTest = false;

        // --- WEB AUDIO API SYNTHESIS ---
        function playChime(type = 'focus') {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                if (type === 'focus') {
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        gain.gain.setValueAtTime(0, now + idx * 0.12);
                        gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.12 + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 1.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 1.3);
                    });
                } else {
                    const freqs = [440.00, 554.37, 659.25];
                    freqs.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.15);
                        gain.gain.setValueAtTime(0, now + idx * 0.15);
                        gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.15 + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 1.5);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.15);
                        osc.stop(now + idx * 0.15 + 1.6);
                    });
                }
            } catch (e) {
                console.warn('Audio playback error:', e);
            }
        }

        // --- WAKE LOCK API ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    updateWakeLockUI(true);
                    wakeLock.addEventListener('release', () => { updateWakeLockUI(false); });
                } catch (err) {
                    updateWakeLockUI(false);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
            updateWakeLockUI(false);
        }

        function updateWakeLockUI(active) {
            const badge = document.getElementById('wakeLockBadge');
            const text = document.getElementById('wakeLockStatusText');
            if (active) {
                badge.className = 'inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
                text.innerText = '后台熄屏保护: 已开启';
                text.className = 'text-emerald-600 font-medium';
            } else {
                badge.className = 'inline-block w-2 h-2 rounded-full bg-stone-300';
                text.innerText = '后台熄屏保护: 未开启';
                text.className = 'text-stone-500';
            }
        }

        // --- LOCAL STORAGE HELPERS ---
        function saveProjects() { localStorage.setItem('pomodoro_projects', JSON.stringify(state.projects)); }
        function saveRecords() { localStorage.setItem('pomodoro_records', JSON.stringify(state.records)); }

        // --- RENDER PROJECT TAGS (MATCHING SCREENSHOT) ---
        function renderProjects() {
            const container = document.getElementById('projectTagsContainer');
            container.innerHTML = '';

            state.projects.forEach(proj => {
                const isActive = proj === state.currentProject;
                const btn = document.createElement('div');
                btn.className = `group px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-1.5 cursor-pointer whitespace-nowrap active:scale-95 ${
                    isActive 
                    ? 'bg-tomato-500 text-white shadow-md shadow-tomato-500/25' 
                    : 'bg-stone-100 text-stone-700 hover:bg-stone-200'
                }`;
                
                btn.innerHTML = `
                    <span>${proj}</span>
                    ${state.projects.length > 1 ? `<span class="delete-tag-btn opacity-40 hover:opacity-100 text-[10px] ml-0.5">✕</span>` : ''}
                `;

                btn.onclick = (e) => {
                    if (e.target.classList.contains('delete-tag-btn')) {
                        e.stopPropagation();
                        deleteProject(proj);
                        return;
                    }
                    if (timerMode !== 'IDLE') return;
                    state.currentProject = proj;
                    localStorage.setItem('pomodoro_current_project', proj);
                    document.getElementById('activeProjectLabel').innerText = proj;
                    renderProjects();
                };
                container.appendChild(btn);
            });

            document.getElementById('activeProjectLabel').innerText = state.currentProject;
        }

        function deleteProject(proj) {
            state.projects = state.projects.filter(p => p !== proj);
            if (state.currentProject === proj) {
                state.currentProject = state.projects[0] || '练字';
                localStorage.setItem('pomodoro_current_project', state.currentProject);
            }
            saveProjects();
            renderProjects();
        }

        // --- TIMER ENGINE LOGIC ---
        function updateTimerDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            document.getElementById('timerDisplay').innerText = formatted;

            // Stroke Progress Circle
            const circle = document.getElementById('timerProgressCircle');
            const total = timerDurationSeconds;
            const progress = (total - remainingSeconds) / total;
            const dashoffset = 276.46 * (1 - progress);
            circle.style.strokeDashoffset = dashoffset;
        }

        function startTimer() {
            if (timerMode === 'IDLE') {
                timerMode = 'FOCUSING';
                timerDurationSeconds = isFastTest ? 5 : state.settings.focusMinutes * 60;
                remainingSeconds = timerDurationSeconds;
                document.getElementById('timerStateText').innerText = `🍅 专注中 (${state.currentProject})`;
                document.getElementById('timerProgressCircle').setAttribute('stroke', '#E53935');
            } else if (timerMode === 'BREAKING') {
                document.getElementById('timerStateText').innerText = '☕ 5分钟休息中...';
                document.getElementById('timerProgressCircle').setAttribute('stroke', '#10B981');
            }

            targetEndTime = Date.now() + remainingSeconds * 1000;
            requestWakeLock();

            document.getElementById('startBtnText').innerText = '暂停';
            document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(tick, 200);
        }

        function pauseTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            releaseWakeLock();
            document.getElementById('startBtnText').innerText = '继续';
            document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
        }

        function resetTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            releaseWakeLock();
            timerMode = 'IDLE';
            isFastTest = false;
            timerDurationSeconds = state.settings.focusMinutes * 60;
            remainingSeconds = timerDurationSeconds;
            document.getElementById('timerStateText').innerText = '准备开始专注';
            document.getElementById('startBtnText').innerText = '开始专注';
            document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            document.getElementById('timerProgressCircle').setAttribute('stroke', '#E53935');
            updateTimerDisplay();
        }

        function tick() {
            const now = Date.now();
            const diff = Math.max(0, Math.ceil((targetEndTime - now) / 1000));
            remainingSeconds = diff;
            updateTimerDisplay();

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                onTimerFinish();
            }
        }

        function onTimerFinish() {
            if (timerMode === 'FOCUSING') {
                playChime('focus');
                
                // Log Record
                const now = new Date();
                const record = {
                    id: Date.now(),
                    project: state.currentProject,
                    timestamp: now.getTime(),
                    dateStr: now.toISOString().split('T')[0],
                    minutes: isFastTest ? 25 : state.settings.focusMinutes
                };
                state.records.push(record);
                saveRecords();

                // Transition to 5 min break
                timerMode = 'BREAKING';
                timerDurationSeconds = isFastTest ? 3 : state.settings.breakMinutes * 60;
                remainingSeconds = timerDurationSeconds;
                document.getElementById('timerStateText').innerText = '☕ 5分钟休息中...';
                document.getElementById('timerProgressCircle').setAttribute('stroke', '#10B981');
                
                startTimer();

            } else if (timerMode === 'BREAKING') {
                playChime('break');
                releaseWakeLock();
                timerMode = 'IDLE';
                document.getElementById('breakPromptModal').classList.remove('hidden');
            }
        }

        // --- STATISTICS ENGINE WITH DATE PICKER & BACK TO TODAY ---
        let currentStatPeriod = 'day'; // 'day' | 'week' | 'month' | 'year'
        let selectedStatDate = new Date();

        function setStatDate(newDate) {
            selectedStatDate = new Date(newDate);
            const isoStr = selectedStatDate.toISOString().split('T')[0];
            document.getElementById('statDatePicker').value = isoStr;
            renderStats();
        }

        function shiftStatDate(delta) {
            const d = new Date(selectedStatDate);
            if (currentStatPeriod === 'day') {
                d.setDate(d.getDate() + delta);
            } else if (currentStatPeriod === 'week') {
                d.setDate(d.getDate() + delta * 7);
            } else if (currentStatPeriod === 'month') {
                d.setMonth(d.getMonth() + delta);
            } else if (currentStatPeriod === 'year') {
                d.setFullYear(d.getFullYear() + delta);
            }
            setStatDate(d);
        }

        function renderStats() {
            const selectedIso = selectedStatDate.toISOString().split('T')[0];
            
            let filteredRecords = [];

            if (currentStatPeriod === 'day') {
                filteredRecords = state.records.filter(r => r.dateStr === selectedIso);
            } else if (currentStatPeriod === 'week') {
                // Compute Monday - Sunday range for selected date
                const curr = new Date(selectedStatDate);
                const dayOfWeek = curr.getDay() === 0 ? 7 : curr.getDay(); // 1-7
                const monday = new Date(curr);
                monday.setDate(curr.getDate() - dayOfWeek + 1);
                monday.setHours(0,0,0,0);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                sunday.setHours(23,59,59,999);

                filteredRecords = state.records.filter(r => r.timestamp >= monday.getTime() && r.timestamp <= sunday.getTime());
            } else if (currentStatPeriod === 'month') {
                const monthPrefix = selectedIso.substring(0, 7);
                filteredRecords = state.records.filter(r => r.dateStr && r.dateStr.startsWith(monthPrefix));
            } else if (currentStatPeriod === 'year') {
                const yearPrefix = selectedIso.substring(0, 4);
                filteredRecords = state.records.filter(r => r.dateStr && r.dateStr.startsWith(yearPrefix));
            }

            const totalTomatoes = filteredRecords.length;
            const totalMinutes = filteredRecords.reduce((sum, r) => sum + (r.minutes || 25), 0);

            document.getElementById('statTotalTomatoes').innerText = totalTomatoes;
            document.getElementById('statTotalMinutes').innerText = totalMinutes;

            // Project Progress Bars
            const projectCounts = {};
            state.projects.forEach(p => projectCounts[p] = 0);
            filteredRecords.forEach(r => {
                projectCounts[r.project] = (projectCounts[r.project] || 0) + 1;
            });

            const statsContainer = document.getElementById('projectStatsContainer');
            statsContainer.innerHTML = '';

            state.projects.forEach(proj => {
                const count = projectCounts[proj] || 0;
                const percent = totalTomatoes > 0 ? Math.round((count / totalTomatoes) * 100) : 0;

                const item = document.createElement('div');
                item.className = 'space-y-1';
                item.innerHTML = `
                    <div class="flex justify-between items-center text-xs font-semibold text-stone-700">
                        <span>${proj}</span>
                        <span class="text-stone-500">${count} 个番茄 (${percent}%)</span>
                    </div>
                    <div class="w-full bg-stone-100 rounded-full h-2 overflow-hidden">
                        <div class="bg-tomato-500 h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                    </div>
                `;
                statsContainer.appendChild(item);
            });

            // Log entries list
            const logsContainer = document.getElementById('historyLogsContainer');
            logsContainer.innerHTML = '';
            document.getElementById('logCountBadge').innerText = `${filteredRecords.length}条记录`;

            const sortedLogs = [...filteredRecords].reverse().slice(0, 30);
            if (sortedLogs.length === 0) {
                logsContainer.innerHTML = `<div class="text-center py-6 text-stone-400">该时间范围内尚无专注记录</div>`;
            } else {
                sortedLogs.forEach(log => {
                    const date = new Date(log.timestamp);
                    const timeStr = `${date.getMonth() + 1}月${date.getDate()}日 ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                    const el = document.createElement('div');
                    el.className = 'flex items-center justify-between p-2.5 bg-stone-50 rounded-2xl border border-stone-200/60';
                    el.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="text-base">🍅</span>
                            <div>
                                <div class="font-bold text-stone-800">${log.project}</div>
                                <div class="text-[10px] text-stone-400">${timeStr}</div>
                            </div>
                        </div>
                        <span class="font-bold text-tomato-600 bg-tomato-50 px-2.5 py-0.5 rounded-full text-xs">+${log.minutes || 25} 分钟</span>
                    `;
                    logsContainer.appendChild(el);
                });
            }
        }

        // --- PWA DYNAMIC MANIFEST ---
        function initPWA() {
            const iconUrl = new URL('./clock.png', window.location.href).href;
            const manifest = {
                name: "番茄钟",
                short_name: "番茄钟",
                description: "极简番茄钟专注应用",
                start_url: "./",
                display: "standalone",
                background_color: "#FAF7F2",
                theme_color: "#E53935",
                icons: [
                    {
                        src: iconUrl,
                        sizes: "512x512",
                        type: "image/png",
                        purpose: "any maskable"
                    }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            let link = document.querySelector('link[rel="manifest"]');
            if (!link) {
                link = document.createElement('link');
                link.rel = 'manifest';
                document.head.appendChild(link);
            }
            link.href = URL.createObjectURL(blob);
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            initPWA();
            renderProjects();
            updateTimerDisplay();
            setStatDate(new Date());

            // Bottom Nav Tabs
            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.onclick = () => {
                    const targetId = btn.getAttribute('data-tab');
                    document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
                    document.getElementById(targetId).classList.remove('hidden');

                    document.querySelectorAll('.nav-tab-btn').forEach(b => {
                        b.classList.remove('text-tomato-600');
                        b.classList.add('text-stone-400');
                    });
                    btn.classList.remove('text-stone-400');
                    btn.classList.add('text-tomato-600');

                    if (targetId === 'viewStats') renderStats();
                };
            });

            // Timer Controls
            document.getElementById('toggleTimerBtn').onclick = () => {
                if (timerInterval) pauseTimer(); else startTimer();
            };
            document.getElementById('resetTimerBtn').onclick = resetTimer;

            // Fast Test Mode
            document.getElementById('fastTestBtn').onclick = () => {
                if (timerMode !== 'IDLE') return;
                isFastTest = true;
                startTimer();
            };

            // Project Addition Modal
            document.getElementById('openAddProjectBtn').onclick = () => {
                document.getElementById('addProjectModal').classList.remove('hidden');
            };
            document.getElementById('cancelProjectBtn').onclick = () => {
                document.getElementById('addProjectModal').classList.add('hidden');
            };
            document.getElementById('confirmProjectBtn').onclick = () => {
                const input = document.getElementById('customProjectInput');
                const val = input.value.trim();
                if (val && !state.projects.includes(val)) {
                    state.projects.push(val);
                    saveProjects();
                    state.currentProject = val;
                    localStorage.setItem('pomodoro_current_project', val);
                    renderProjects();
                }
                input.value = '';
                document.getElementById('addProjectModal').classList.add('hidden');
            };

            // Break Finished Modal Actions
            document.getElementById('continueNextFocusBtn').onclick = () => {
                document.getElementById('breakPromptModal').classList.add('hidden');
                resetTimer();
                startTimer();
            };
            document.getElementById('extendBreakBtn').onclick = () => {
                document.getElementById('breakPromptModal').classList.add('hidden');
                timerMode = 'BREAKING';
                timerDurationSeconds = 5 * 60;
                remainingSeconds = timerDurationSeconds;
                startTimer();
            };
            document.getElementById('stopSessionBtn').onclick = () => {
                document.getElementById('breakPromptModal').classList.add('hidden');
                resetTimer();
            };

            // Statistics Date & Period Controls
            document.querySelectorAll('.stat-period-tab').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.stat-period-tab').forEach(t => {
                        t.classList.remove('bg-white', 'shadow-xs', 'text-stone-800');
                        t.classList.add('text-stone-500');
                    });
                    tab.classList.add('bg-white', 'shadow-xs', 'text-stone-800');
                    tab.classList.remove('text-stone-500');

                    currentStatPeriod = tab.getAttribute('data-period');
                    
                    const labelMap = { day: '天', week: '周', month: '月', year: '年' };
                    document.getElementById('prevUnitLabel').innerText = labelMap[currentStatPeriod];
                    document.getElementById('nextUnitLabel').innerText = labelMap[currentStatPeriod];

                    renderStats();
                };
            });

            document.getElementById('statDatePicker').onchange = (e) => {
                if (e.target.value) {
                    setStatDate(new Date(e.target.value + 'T00:00:00'));
                }
            };
            document.getElementById('prevDateBtn').onclick = () => shiftStatDate(-1);
            document.getElementById('nextDateBtn').onclick = () => shiftStatDate(1);
            document.getElementById('backToTodayBtn').onclick = () => setStatDate(new Date());

            // Settings options
            document.getElementById('focusDurationSelect').onchange = (e) => {
                state.settings.focusMinutes = parseInt(e.target.value);
                localStorage.setItem('pomodoro_focus_min', state.settings.focusMinutes);
                if (timerMode === 'IDLE') resetTimer();
            };
            document.getElementById('breakDurationSelect').onchange = (e) => {
                state.settings.breakMinutes = parseInt(e.target.value);
                localStorage.setItem('pomodoro_break_min', state.settings.breakMinutes);
            };

            // Audio Tests
            document.getElementById('testFocusChimeBtn').onclick = () => playChime('focus');
            document.getElementById('testBreakChimeBtn').onclick = () => playChime('break');

            // Data Reset
            document.getElementById('clearAllDataBtn').onclick = () => {
                state.records = [];
                state.projects = [...DEFAULT_PROJECTS];
                state.currentProject = '练字';
                saveRecords();
                saveProjects();
                renderProjects();
                renderStats();
            };
        };
    </script>
</body>
</html>
